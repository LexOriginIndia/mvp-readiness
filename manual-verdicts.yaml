# Manual verdicts.
#
# Every verdict below is written by "Claude Opus 4.7" based on
# code review and session history only.  No UI walk-through, no
# AI output quality testing, no load testing, no external-document
# verification.  Where the honest answer is "code is present but
# quality is unverified" the verdict is `needs_work`, not `pass`.
#
# Human reviewer MUST re-walk every `needs_work` item in the UI and
# either confirm (change to `pass`) or document the gap (keep as
# `needs_work` with sharper evidence, or downgrade to `fail`).
