# Format reminder:
#   - feature_id: <id from annexure-a or annexure-c>
#     question: "<copy of the manual check question — for context only>"
#     verdict: pass | fail | needs_work
#     evidence: "<one line — code paths, missing docs, measured number, etc.>"
#     reviewed_by: "<name>"
#     reviewed_on: "<YYYY-MM-DD>"

