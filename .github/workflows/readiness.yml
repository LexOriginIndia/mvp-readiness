# Auto-regenerate the readiness report whenever:
#   • an issue is closed / reopened / edited
#   • code is pushed to main (spec changes)
#   • daily at 02:00 UTC (so a verdict going stale shows up without a push)
#
# The runner has read access to issue state via the Action's built-in
# GITHUB_TOKEN (passed through so the github_issue checks can hit the
# API).  On the main branch, the regenerated reports/latest.md +
# reports/latest.json + reports/history/<date>.json get committed back
# to the repo so anyone (including the Client watching the repo) sees
# the current state without having to run anything.

name: Readiness

on:
  issues:
    types: [opened, closed, reopened, edited, labeled, unlabeled]
  push:
    branches: [main]
    paths:
      - 'spec/**'
      - 'src/**'
      - 'manual-verdicts.yaml'
      - 'package.json'
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  issues: read

jobs:
  readiness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install deps
        run: npm ci

      - name: Run readiness
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # The engine reads code-grep targets relative to LEX_ORIGIN_ROOT.
        # In Actions we only have THIS repo checked out, so set the root
        # to the workspace. The file_exists + grep checks that reference
        # other repos will fail / 0-match — their status flips to
        # not_started which is accurate for the Action's point of view.
        # Treat the Action-rendered report as "issue state + manual
        # verdicts + acceptance metrics", not as a full codebase audit —
        # the local run (with full workspace checkout) remains the
        # authoritative code audit.
        run: |
          export LEX_ORIGIN_ROOT="$GITHUB_WORKSPACE"
          npm run readiness

      - name: Commit regenerated reports
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "readiness-bot"
          git config user.email "readiness-bot@users.noreply.github.com"
          git add reports/latest.md reports/latest.json reports/history/*.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "no report changes to commit"
          else
            git commit -m "readiness: auto-regenerate ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
            git push
          fi
