- id: rag-pipelines
  name: RAG pipelines (retrieval-augmented generation)
  annexure: 3.1 Core AI Development
  required_for_mvp: true
  checks:
    - type: file_exists
      path: prism-service/app/main.py
      note: Prism service is the RAG + search backend
    - type: grep
      path: prism-service/app
      pattern: (retrieval|embedding|chunk|vector)
      min_matches: 3
      note: Must have retrieval + embedding + chunking code
    - type: manual
      question: Does the RAG pipeline retrieve and ground answers from the Indian legal corpus? Give a
        sample query + top-3 citations.
      review_cadence_days: 30
    - type: github_issue
      issue: LexOriginIndia/mvp-readiness#1
      note: Auto-added by merge-issues. Close the issue to flip this feature to Done.
